version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: dealership_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  database-api:
    build: .
    container_name: dealership_api
    restart: always
    ports:
      - "3030:3030"
    environment:
      - PORT=3030
      - MONGO_URL=mongodb://mongo:27017/dealershipsDB
    depends_on:
      - mongo

volumes:
  mongo_data:
